# Production stack: docker compose -f docker-compose.prod.yml up -d --build

# Separate project name from the dev stack
name: coachlink-prod

x-app: &app
  build: .
  env_file: .env
  environment:
    DEBUG: "False"
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    CELERY_BROKER_URL: redis://redis:6379/0
    CHANNEL_REDIS_URL: redis://redis:6379/1
    # Defaults for local testing; set real values in the server's .env
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    <<: *app
    # Apply migrations, collect static files, then start daphne
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 --proxy-headers CoachLink.asgi:application"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media        # الملفات المرفوعة لازم تضل حتى لو انمسح الكونتينر
    # ما في ports: بس nginx بيوصلو من جوا شبكة Docker

  celery:
    <<: *app
    command: celery -A CoachLink worker -l info

  # نسخة وحدة بس (متل التطوير) وإلا كل مهمة بتنبعت مرتين
  celery-beat:
    <<: *app
    command: celery -A CoachLink beat -l info --schedule /tmp/celerybeat-schedule

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      # :ro = قراءة بس - nginx ما إلو يعدّل على شي
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  static_data:
  media_data:
