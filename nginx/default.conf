# Reverse proxy: serves static/media files and forwards the rest to daphne

# "web" service from docker-compose.prod.yml
upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;   # host filtering is done by Django ALLOWED_HOSTS

    # Max upload size
    client_max_body_size 20M;

    # ملفات الـ admin والـ swagger يلي جمعها collectstatic
    location /static/ {
        alias /app/staticfiles/;
    }

    # الملفات يلي رفعوها المستخدمين (Django ما بيخدمها لما DEBUG=False)
    location /media/ {
        alias /app/media/;
    }

    # الـ WebSocket تبع الشات: ws://domain/ws/chat/<id>/?token=...
    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;                     # WebSocket بدو HTTP/1.1
        proxy_set_header Upgrade $http_upgrade;     # هدول الاتنين بيخلوا الاتصال
        proxy_set_header Connection "upgrade";      # يتحول من HTTP لـ WebSocket
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep idle chat connections open
        proxy_read_timeout 86400s;
    }

    # كل شي تاني: /api/ ، /admin/ ، /api/docs/
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;                                   # مشان ALLOWED_HOSTS
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # IP المستخدم الحقيقي
        proxy_set_header X-Forwarded-Proto $scheme;                    # http ولا https
    }
}
