x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    CELERY_BROKER_URL: redis://redis:6379/0
    CHANNEL_REDIS_URL: redis://redis:6379/1
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
  web:
    <<: *app
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  celery:
    <<: *app
    command: celery -A CoachLink worker -l info

  # المنبّه: بيقرأ CELERY_BEAT_SCHEDULE من settings وكل ما يجي وقت مهمة بيبعتها
  # للـ celery worker عن طريق Redis - هو ما بينفذ شي بنفسو
  # لازم تكون نسخة وحدة بس منو، وإلا كل مهمة بتنبعت مرتين
  # --schedule: الملف يلي بيتذكر فيه beat آخر مرة شغّل كل مهمة، بنحطو بـ /tmp
  # مشان ما يطلع بفولدر المشروع على جهازك (بسبب الـ volume .:/app)
  celery-beat:
    <<: *app
    command: celery -A CoachLink beat -l info --schedule /tmp/celerybeat-schedule

volumes:
  postgres_data:
